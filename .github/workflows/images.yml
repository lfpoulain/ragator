# Publie les images sur ghcr.io : ghcr.io/lfpoulain/ragator et ghcr.io/lfpoulain/ragator-juge.
#   push sur main  → :latest et :sha-<commit>
#   tag v1.2.3     → :1.2.3, :1.2 et :latest
name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ragator
            context: .
          # Juge du mode local : PyTorch CUDA, plusieurs Go. Ne contient aucun modèle (Aplomb est
          # téléchargé au premier démarrage avec le jeton Hugging Face de l'utilisateur).
          - name: ragator-juge
            context: docker/juge
    steps:
      - uses: actions/checkout@v4

      # L'image du juge dépasse l'espace libre par défaut du runner.
      - name: Libérer de l'espace disque
        if: matrix.name == 'ragator-juge'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
