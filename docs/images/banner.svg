    <rect x="20" y="46" width="250" height="12" rx="6" fill="#3a3a42"/>
    <rect x="20" y="70" width="160" height="12" rx="6" fill="#3a3a42"/>
    <rect x="20" y="104" width="118" height="30" rx="15" fill="#3a2019"/>
    <text x="38" y="125" font-size="16" font-weight="600" fill="#ff7a5f">▶ 03:45</text>
    <rect x="150" y="104" width="118" height="30" rx="15" fill="#3a2019"/>
    <text x="168" y="125" font-size="16" font-weight="600" fill="#ff7a5f">▶ 11:56</text>
  </g>
