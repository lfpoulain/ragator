<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Ragator : posez vos questions à une chaîne YouTube">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#2a1712"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="140" font-size="84" font-weight="800" fill="#ececef" letter-spacing="-2">Rag<tspan fill="#ff7a5f">ator</tspan></text>
    <text x="84" y="192" font-size="28" fill="#c9c9cf">Posez vos questions à une chaîne YouTube.</text>
    <text x="84" y="232" font-size="22" fill="#9c9ca5">Réponses citées à l’instant près, ou refus quand les vidéos ne le disent pas.</text>
  </g>
  <g transform="translate(820 70)" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="300" height="160" rx="16" fill="#202025" stroke="#3a3a42"/>
