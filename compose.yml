# Ragator. Deux façons de le lancer, la même instance et les mêmes données :
#
#   docker compose --profile local pull && docker compose --profile local up -d
#                                    mode local : tous les modèles sur cette machine
#                                    (carte NVIDIA de 16 Go ou plus, jeton Hugging Face pour Aplomb)
#   docker compose pull && docker compose up -d
#                                    Ragator seul : mode OpenRouter (clé), sans carte graphique
#
# Images publiées sur ghcr.io ; « up -d --build » les construit plutôt depuis ce dépôt.
#
# Puis http://localhost:3210 → onglet Réglages : choisir le mode (et saisir le jeton Hugging Face ou la clé
# OpenRouter). Aucune variable d'environnement à passer.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ragator:
    build: .
    image: ghcr.io/lfpoulain/ragator:latest
    container_name: ragator
    restart: unless-stopped
    ports:
      - target: 3210
        published: '${RAGATOR_PORT:-3210}'
        host_ip: '${RAGATOR_BIND_ADDRESS:-127.0.0.1}'
    environment:
      # La même adresse gouverne la publication Docker et l'exigence d'un mot de passe côté serveur.
      RAGATOR_BIND_ADDRESS: '${RAGATOR_BIND_ADDRESS:-127.0.0.1}'
      RAGATOR_PASSWORD: '${RAGATOR_PASSWORD:-}'
      RAGATOR_HOSTS: '${RAGATOR_HOSTS:-}'
      RAGATOR_PUBLIC_URL: '${RAGATOR_PUBLIC_URL:-}'
      RAGATOR_GATEWAY_SECRET: '${RAGATOR_GATEWAY_SECRET:-}'
      RAGATOR_GATEWAY_TRUST: '${RAGATOR_GATEWAY_TRUST:-1}'
      RAGATOR_GATEWAY_PEERS: '${RAGATOR_GATEWAY_PEERS:-}'
      RAGATOR_GUEST_HOURLY: '${RAGATOR_GUEST_HOURLY:-}'
    volumes:
      - ragator-data:/data
      # Facultatif : un dossier de fichiers video--<id>.json (yt2md : son dossier outputs/), lu à chaque mise à jour.
      # - ./corpus:/data/corpus
    # Mémoire partagée de PostgreSQL : index vectoriels et requêtes parallèles.
    shm_size: 1gb
    stop_grace_period: 30s

  # ── Mode local (profil « local ») : trois serveurs de modèles, joints par Ragator dans ce réseau ──────────
  # Modèles téléchargés au premier démarrage dans le volume ragator-models (~17 Go).
  # Places (-np) et contexte (-c) du LLM : Ragator suppose 8 et 81920 (voir README).

  # Qwen 3.5 9B (tête MTP intégrée), réponses et enrichissement : carte graphique, ~11 Go.
  llm:
    <<: *gpu
    profiles: [local]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11515
    restart: unless-stopped
    healthcheck:
      start_period: 30m
    environment:
      LLAMA_CACHE: /models/llama
      # Qwen 3.5 réfléchit par défaut : coupé ici (Ragator l'en dispense aussi à chaque requête).
      LLAMA_ARG_CHAT_TEMPLATE_KWARGS: '{"enable_thinking":false}'
    # 8 requêtes à la fois sur un contexte partagé, cache en 8 bits ; sans vision (--no-mmproj) ni copie du
    # modèle en RAM (--load-mode none). Décodage spéculatif par la tête MTP, sortie identique ; température 0 :
    # réponses reproductibles. Cache des prompts limité à 1 Go : chaque question envoie d'autres extraits.
    command: >
      -hf unsloth/Qwen3.5-9B-MTP-GGUF:UD-Q4_K_XL --no-mmproj --alias qwen3.5-9b
      --spec-type draft-mtp --spec-draft-n-max 3 --temp 0
      -ngl 99 -c 81920 -np 8 --kv-unified -ctk q8_0 -ctv q8_0 --load-mode none --cache-ram 1024 --jinja
      --host 0.0.0.0 --port 8080
    volumes:
      - ragator-models:/models

  # Aplomb 1 en 4 bits, juge des questions générales : carte graphique, ~5,3 Go. Sous licence : jeton
  # Hugging Face saisi dans Réglages (licence acceptée sur huggingface.co/empiriolabsai/aplomb-1).
  juge:
    <<: *gpu
    profiles: [local]
    build: ./docker/juge
    image: ghcr.io/lfpoulain/ragator-juge:latest
    restart: unless-stopped
    volumes:
      - ragator-models:/models

  # pplx-embed-v1-4b (vecteurs, le même encodeur que par OpenRouter) : processeur, ~1,5 Go de RAM.
  embed:
    profiles: [local]
    image: ghcr.io/ggml-org/llama.cpp:server-b11515
    restart: unless-stopped
    healthcheck:
      start_period: 30m
    environment:
      LLAMA_CACHE: /models/llama
    command: >
      -hf seamon67/PPLX-Embed-v1-4B-GGUF:Q8_0 --embedding --pooling mean -c 8192 -ub 8192
      --host 0.0.0.0 --port 8080
    volumes:
      - ragator-models:/models

  # Base seule, pour développer (npm run db:up) : jamais lancée par « docker compose up ».
  db:
    profiles: [dev]
    image: paradedb/paradedb:0.25.9-pg17
    environment:
      POSTGRES_USER: ragator
      POSTGRES_PASSWORD: ragator
      POSTGRES_DB: ragator
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 1gb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ragator -d ragator']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  ragator-data:
  ragator-models:
  pgdata:
